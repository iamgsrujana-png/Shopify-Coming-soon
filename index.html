<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>PeerNest — Coming Soon</title>

  <meta
    name="description"
    content="PeerNest is under construction. We're building a student-first platform for college discovery, mentorship, events and communities."
  />

  <meta name="theme-color" content="#f6f0e8" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #f6f0e8;
    }

    body {
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      background: #f6f0e8;
    }

    .image-wrapper {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: hidden;
    }

    .desktop-image,
    .mobile-image {
      display: block;
      height: auto;
    }

    /* ======================================
       DESKTOP
       ====================================== */

    .page {
      padding: 18px 14px;
    }

    .image-wrapper {
      width: 96%;
      max-width: 1700px;
    }

    .desktop-image {
      display: block;
      width: 100%;
    }

    .mobile-image {
      display: none;
    }

    /* LARGE DESKTOP */

    @media (min-width: 1500px) {
      .image-wrapper {
        width: 94%;
        max-width: 1800px;
      }
    }

    /* TABLET */

    @media (max-width: 1100px) and (min-width: 769px) {
      .page {
        padding: 12px;
      }

      .image-wrapper {
        width: 98%;
      }
    }

    /* ======================================
       MOBILE
       ====================================== */

    @media (max-width: 768px) {

      html,
      body {
        width: 100%;
        min-height: 100%;
        background: #f6f0e8;
      }

      .page {
        width: 100%;
        min-height: 100svh;

        padding: 0;

        display: block;

        overflow: hidden;
      }

      .image-wrapper {
        width: 100%;
        max-width: none;

        display: block;

        overflow: hidden;
      }

      .desktop-image {
        display: none;
      }

      .mobile-image {
        display: block;

        /*
          Slightly wider than the viewport.
          Because the image keeps its aspect ratio,
          this also makes it slightly taller.
        */

        width: 108%;
        max-width: none;
        height: auto;

        margin-left: -4%;

        object-fit: contain;
        object-position: top center;
      }
    }

    /* SMALLER PHONES */

    @media (max-width: 430px) {

      .mobile-image {
        width: 110%;
        margin-left: -5%;
      }
    }

  </style>
</head>

<body>

  <main class="page">

    <div class="image-wrapper">

      <!-- DESKTOP IMAGE -->
      <img
        class="desktop-image"
        src="/coming-soon.png?v=4"
        alt="PeerNest website is under construction"
        fetchpriority="high"
      />

      <!-- MOBILE IMAGE -->
      <img
        class="mobile-image"
        src="/peernest_campus_coming_soon.png?v=4"
        alt="PeerNest website is under construction"
        fetchpriority="high"
        onerror="this.src='/coming-soon.png?v=4'"
      />

    </div>

  </main>

</body>
</html>
