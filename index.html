<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>PeerNest — Coming Soon</title>

  <meta
    name="description"
    content="PeerNest is under construction. We're building a student-first platform for college discovery, mentorship, events and communities."
  />

  <meta name="theme-color" content="#f6f0e8" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #f6f0e8;
    }

    body {
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      background: #f6f0e8;
    }

    .image-wrapper {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .desktop-image,
    .mobile-image {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ---------------- DESKTOP ---------------- */

    .image-wrapper {
      width: 82%;
      max-width: 1350px;
    }

    .page {
      padding: 24px 16px;
    }

    .mobile-image {
      display: none;
    }

    .desktop-image {
      display: block;
    }

    /* ---------------- TABLET ---------------- */

    @media (max-width: 1100px) and (min-width: 769px) {
      .image-wrapper {
        width: 94%;
      }
    }

    /* ---------------- MOBILE ---------------- */

    @media (max-width: 768px) {

      html,
      body {
        width: 100%;
        min-height: 100vh;
        background: #f6f0e8;
      }

      .page {
        width: 100%;
        min-height: 100vh;
        padding: 0;
        display: block;
      }

      .image-wrapper {
        width: 100%;
        max-width: none;
        display: block;
      }

      .desktop-image {
        display: none;
      }

      .mobile-image {
        display: block;
        width: 100%;
        height: auto;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="image-wrapper">

      <!-- DESKTOP -->
      <img
        class="desktop-image"
        src="/coming-soon.png?v=3"
        alt="PeerNest website is under construction"
        fetchpriority="high"
      />

      <!-- MOBILE -->
      <img
        class="mobile-image"
        src="/peernest_campus_coming_soon.png?v=3"
        alt="PeerNest website is under construction"
        fetchpriority="high"
        onerror="this.src='/coming-soon.png?v=3'"
      />

    </div>

  </main>

</body>
</html>
