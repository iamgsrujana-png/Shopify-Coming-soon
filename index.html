<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>PeerNest — Coming Soon</title>

  <meta
    name="description"
    content="PeerNest is under construction. We're building a student-first platform for college discovery, mentorship, events and communities."
  />

  <meta name="theme-color" content="#f6f0e8" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #f6f0e8;
    }

    body {
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      background: #f6f0e8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .image-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    picture {
      display: block;
      width: 100%;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* DESKTOP */
    @media (min-width: 769px) {
      .page {
        padding: 24px 16px;
      }

      .image-wrapper {
        width: 82%;
        max-width: 1350px;
      }

      img {
        width: 100%;
        height: auto;
      }
    }

    /* TABLET */
    @media (min-width: 769px) and (max-width: 1100px) {
      .image-wrapper {
        width: 94%;
      }
    }

    /* MOBILE */
    @media (max-width: 768px) {
      html,
      body {
        width: 100%;
        min-height: 100vh;
        background: #f6f0e8;
      }

      .page {
        width: 100%;
        min-height: 100vh;
        padding: 0;
        display: block;
      }

      .image-wrapper {
        width: 100%;
        max-width: none;
        display: block;
      }

      picture {
        width: 100%;
        display: block;
      }

      img {
        width: 100%;
        height: auto;
        display: block;
      }
    }
  </style>
</head>

<body>

  <main class="page">
    <div class="image-wrapper">

      <picture>

        <!-- MOBILE IMAGE -->
        <source
          media="(max-width: 768px)"
          srcset="./peernest_campus_coming_soon.png"
        />

        <!-- DESKTOP IMAGE -->
        <img
          src="./coming-soon.png"
          alt="PeerNest website is under construction"
          fetchpriority="high"
        />

      </picture>

    </div>
  </main>

</body>
</html>
